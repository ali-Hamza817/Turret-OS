[tool.poetry]
name = "turret-harvest"
version = "0.1.0"
description = "TURRET OS — L1 multi-format metadata harvest layer"
authors = ["TURRET OS Research Team"]
packages = [{include = "turret_harvest"}]

[tool.poetry.dependencies]
python        = "^3.11"
turret-common = {path = "../turret-common", develop = true}
tika          = "==2.6.0"
python-docx   = "==1.1.2"
openpyxl      = "==3.1.5"
python-pptx   = "==1.0.2"
pikepdf       = "==9.3.0"
olefile       = "==0.47"
ezdxf         = "==1.3.3"
pygit2        = "==1.15.0"
pillow        = "==10.4.0"
pyarrow       = "==16.1.0"
pandas        = "==2.2.2"
duckdb        = "==0.10.3"
pyyaml        = "==6.0.2"
click         = "==8.1.7"
rich          = "==13.7.1"

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
