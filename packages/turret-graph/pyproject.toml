[tool.poetry]
name = "turret-graph"
version = "0.1.0"
description = "TURRET OS — L2 provenance knowledge graph builder"
authors = ["TURRET OS Research Team"]
packages = [{include = "turret_graph"}]

[tool.poetry.dependencies]
python        = "^3.11"
turret-common = {path = "../turret-common", develop = true}
neo4j         = "==5.20.0"
rdflib        = "==7.0.0"
pyarrow       = "==16.1.0"
pandas        = "==2.2.2"
duckdb        = "==0.10.3"
pyyaml        = "==6.0.2"
click         = "==8.1.7"
rich          = "==13.7.1"

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
