[tool.poetry]
name = "turret-evidence"
version = "0.1.0"
description = "TURRET OS — L4 ISO/IEC 27043-aligned forensic evidence packager"
authors = ["TURRET OS Research Team"]
packages = [{include = "turret_evidence"}]

[tool.poetry.dependencies]
python        = "^3.11"
turret-common = {path = "../turret-common", develop = true}
cryptography  = "==42.0.8"
blake3        = "==0.4.1"
rdflib        = "==7.0.0"
pyyaml        = "==6.0.2"
click         = "==8.1.7"
rich          = "==13.7.1"

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
