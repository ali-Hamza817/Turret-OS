[tool.poetry]
name = "turret-common"
version = "0.1.0"
description = "TURRET OS — Shared schemas, hashing utilities, and configuration"
authors = ["TURRET OS Research Team"]
packages = [{include = "turret_common"}]

[tool.poetry.dependencies]
python        = "^3.11"
pydantic      = "==2.8.2"
pydantic-settings = "==2.3.4"
pyyaml        = "==6.0.2"
cryptography  = "==42.0.8"
blake3        = "==0.4.1"
python-dotenv = "==1.0.1"

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
