[tool.poetry]
name = "turret-os"
version = "0.1.0"
description = "TURRET OS — Provenance Sentinel for Espionage-Grade Insider Detection"
authors = ["TURRET OS Research Team"]
readme = "README.md"
package-mode = false
packages = []

[tool.poetry.dependencies]
python = "^3.11"

# ── Workspace packages (local) ─────────────────────────────────────────────
turret-common  = {path = "packages/turret-common",  develop = true}
turret-harvest = {path = "packages/turret-harvest", develop = true}
turret-graph   = {path = "packages/turret-graph",   develop = true}
turret-detect  = {path = "packages/turret-detect",  develop = true}
turret-evidence= {path = "packages/turret-evidence",develop = true}

# ── Metadata extraction ────────────────────────────────────────────────────
tika            = "==2.6.0"
python-docx     = "==1.1.2"
openpyxl        = "==3.1.5"
python-pptx     = "==1.0.2"
pikepdf         = "==9.3.0"
olefile         = "==0.47"
ezdxf           = "==1.3.3"
pygit2          = "==1.15.0"
pillow          = "==10.4.0"

# ── Graph store ────────────────────────────────────────────────────────────
neo4j           = "==5.20.0"

# ── Time-series features ───────────────────────────────────────────────────
duckdb          = "==0.10.3"
pyarrow         = "==16.1.0"
pandas          = "==2.2.2"

# ── ML ─────────────────────────────────────────────────────────────────────
torch           = {version = "==2.3.1", source = "pytorch-cpu"}
torch-geometric = "==2.5.3"
shap            = "==0.46.0"
scikit-learn    = "==1.5.1"
numpy           = "==1.26.4"

# ── Explainability / stats ─────────────────────────────────────────────────
scipy           = "==1.13.1"
statsmodels     = "==0.14.2"
matplotlib      = "==3.9.1"
seaborn         = "==0.13.2"

# ── Crypto / hashing ──────────────────────────────────────────────────────
cryptography    = "==42.0.8"
blake3          = "==0.4.1"

# ── Provenance serialization ───────────────────────────────────────────────
rdflib          = "==7.0.0"

# ── API ───────────────────────────────────────────────────────────────────
fastapi         = "==0.111.1"
uvicorn         = {extras = ["standard"], version = "==0.30.1"}
pydantic        = "==2.8.2"
pydantic-settings = "==2.3.4"
python-multipart = "==0.0.9"
slowapi          = "==0.1.9"

# ── Task queue ────────────────────────────────────────────────────────────
celery          = "==5.4.0"
redis           = "==5.0.7"

# ── Config ────────────────────────────────────────────────────────────────
pyyaml          = "==6.0.2"
python-dotenv   = "==1.0.1"
click           = "==8.1.7"
rich            = "==13.7.1"

[tool.poetry.dev-dependencies]
pytest          = "==8.2.2"
pytest-asyncio  = "==0.23.7"
pytest-cov      = "==5.0.0"
pytest-mock     = "==3.14.0"
hypothesis      = "==6.108.5"
ruff            = "==0.5.1"
mypy            = "==1.10.1"
black           = "==24.4.2"

[[tool.poetry.source]]
name = "pytorch-cpu"
url  = "https://download.pytorch.org/whl/cpu"
priority = "supplemental"

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "T20"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths       = ["tests"]
asyncio_mode    = "auto"
addopts         = "-v --tb=short --cov=packages --cov-report=term-missing"
