global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "turret-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: "neo4j"
    static_configs:
      - targets: ["neo4j:2004"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
