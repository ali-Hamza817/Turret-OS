version: "3.9"

# ═══════════════════════════════════════════════════════════════════════════
#  TURRET OS — Docker Compose Stack
#  Services: neo4j | redis | api | worker | ui
#  Usage: docker compose -f infra/docker-compose.yml up -d
# ═══════════════════════════════════════════════════════════════════════════

services:

  # ── Neo4j 5.x Provenance KG ─────────────────────────────────────────────
  neo4j:
    image: neo4j:5.20.0-enterprise
    container_name: turret-neo4j
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD required}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "2g"
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    ports:
      - "7474:7474"   # HTTP Browser
      - "7687:7687"   # Bolt
    volumes:
      - ./infra/neo4j/data:/data
      - ./infra/neo4j/logs:/logs
      - ./infra/neo4j/import:/var/lib/neo4j/import
      - ./infra/neo4j/plugins:/plugins
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - turret-net

  # ── Redis (Celery broker) ────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: turret-redis
    command: redis-server --requirepass "${REDIS_PASSWORD:-turret_redis}"
    ports:
      - "6379:6379"
    networks:
      - turret-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # ── FastAPI Server ───────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: turret-api
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
      API_SECRET_KEY: "${API_SECRET_KEY}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-turret_redis}@redis:6379/0"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:5173}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      TURRET_SEED: "${TURRET_SEED:-42}"
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - turret-net
    command: >
      uvicorn apps.api.main:app
        --host 0.0.0.0
        --port 8000
        --workers 2
        --log-level info

  # ── Celery Harvest Worker ────────────────────────────────────────────────
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: turret-worker
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-turret_redis}@redis:6379/0"
      TURRET_SEED: "${TURRET_SEED:-42}"
    depends_on:
      - redis
      - neo4j
    volumes:
      - ../data:/app/data
      - ../evidence_packs:/app/evidence_packs
      - ../models:/app/models
    networks:
      - turret-net
    command: >
      celery -A apps.worker.celery_app worker
        --loglevel=info
        --concurrency=4

  # ── React UI ─────────────────────────────────────────────────────────────
  ui:
    build:
      context: ../apps/ui
      dockerfile: ../../infra/Dockerfile.ui
    container_name: turret-ui
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - turret-net

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: turret-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - turret-net

networks:
  turret-net:
    driver: bridge
